name: Build UEFI Doom (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout uefidoom repository
        uses: actions/checkout@v4
        with:
          path: uefidoom

      - name: Set up NASM & Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Checkout EDK II and EDK II LibC
        run: |
          git clone --recursive https://github.com/tianocore/edk2.git edk2
          git clone https://github.com/tianocore/edk2-libc.git edk2-libc
          xcopy /E /Y edk2-libc\* edk2\

      - name: Inject uefidoom into EDK II
        run: |
          mkdir edk2\AppPkg\Applications\uefidoom
          xcopy /E /Y uefidoom\* edk2\AppPkg\Applications\uefidoom\

          # Register doom.inf inside AppPkg.dsc
          $dscPath = "edk2\AppPkg\AppPkg.dsc"
          (Get-Content $dscPath) -replace '\[Components\]', "[Components]`n  AppPkg/Applications/uefidoom/doom.inf" | Set-Content $dscPath
          (Get-Content $dscPath) -replace '\[LibraryClasses\]', "[LibraryClasses]`n  SerialPortLib|PcAtChipsetPkg/Library/SerialIoLib/SerialIoLib.inf" | Set-Content $dscPath

      - name: Set up Developer Command Prompt for Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build BaseTools and doom.efi
        shell: cmd
        run: |
          cd edk2
          
          :: Build EDK II C BaseTools using Visual Studio
          set EDK_TOOLS_PATH=%CD%\BaseTools
          call edksetup.sh Reconfig
          nmake -f %EDK_TOOLS_PATH%\Source\C\Makefiles\ms.mak
          
          :: Build doom.efi targeting VS2019 / VS2022 toolchain (VS2015x86)
          build -a X64 -t VS2015x86 -p AppPkg/AppPkg.dsc -b DEBUG

      - name: Collect Output
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path build_output -Force
          Get-ChildItem -Path edk2\Build -Recurse -Filter "doom.efi" | Copy-Item -Destination build_output\

      - name: Upload doom.efi Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doom-efi-windows-build
          path: build_output/doom.efi
